# Render lab: (photo, recipe) jobs rendered on the shipping path (macOS, PipelineRenderer)
# and/or the reference path (Linux, ReferenceRenderer on decoded plates), with stats and
# contact sheets. How to use it: renderlab/README.md.
name: Render lab

run-name: "Render lab ${{ inputs.lane || 'macos' }} ${{ inputs.manifests || 'smoke' }} ${{ inputs.label }}"

on:
  push:
    branches: ["claude/loving-cray-d58nrb-renderlab"]
    paths:
      - ".github/workflows/render-lab.yml"
  workflow_dispatch:
    inputs:
      manifests:
        description: "Committed manifests under renderlab/manifests, comma-separated names without .json"
        required: false
        default: ""
      manifest:
        description: "Inline manifest JSON (runs as 'inline')"
        required: false
        default: ""
      lane:
        description: "macos (shipping), linux (reference on plates), both"
        required: false
        default: "macos"
      shards:
        description: "Parallel Linux jobs"
        required: false
        default: "4"
      drift:
        description: "Manifest name to diff reference against shipping on macOS (empty: none)"
        required: false
        default: ""
      plates:
        description: "Regenerate decoded plates even if cached"
        type: boolean
        required: false
        default: false
      runs-on:
        description: "macOS runner label"
        required: false
        default: "macos-15"
      label:
        description: "Free text added to the run name so you can find your run"
        required: false
        default: ""

permissions:
  contents: read

env:
  PLATE_EDGE: "2048"

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      manifests: ${{ steps.m.outputs.manifests }}
      macos: ${{ steps.m.outputs.macos }}
      linux: ${{ steps.m.outputs.linux }}
      shards: ${{ steps.m.outputs.shards }}
      plates-key: ${{ steps.m.outputs.plates_key }}
      plates-hit: ${{ steps.lookup.outputs.cache-hit }}
      photo-ids: ${{ steps.m.outputs.photo_ids }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve manifests
        id: m
        shell: bash
        env:
          INLINE: ${{ inputs.manifest }}
          NAMES: ${{ inputs.manifests }}
          LANE: ${{ inputs.lane || 'macos' }}
          SHARDS: ${{ inputs.shards || '4' }}
        run: |
          mkdir -p resolved
          list=""
          if [ -n "$INLINE" ]; then
            printf '%s' "$INLINE" > resolved/inline.json
            python3 -c 'import json,sys; json.load(open("resolved/inline.json"))' \
              || { echo "::error::inline manifest is not valid JSON"; exit 1; }
            list="inline"
          fi
          [ -z "$NAMES" ] && [ -z "$INLINE" ] && NAMES="smoke"
          IFS=',' read -ra parts <<< "$NAMES"
          for n in "${parts[@]}"; do
            n=$(echo "$n" | tr -d '[:space:]'); [ -z "$n" ] && continue
            case "$n" in *[!A-Za-z0-9._-]*) echo "::error::bad manifest name $n"; exit 1;; esac
            [ -f "renderlab/manifests/$n.json" ] || { echo "::error::no renderlab/manifests/$n.json"; exit 1; }
            cp "renderlab/manifests/$n.json" resolved/
            list="${list:+$list,}$n"
          done
          echo "manifests=$list" >> "$GITHUB_OUTPUT"
          case "$LANE" in
            macos) echo "macos=true" >> "$GITHUB_OUTPUT"; echo "linux=false" >> "$GITHUB_OUTPUT";;
            linux) echo "macos=false" >> "$GITHUB_OUTPUT"; echo "linux=true" >> "$GITHUB_OUTPUT";;
            both) echo "macos=true" >> "$GITHUB_OUTPUT"; echo "linux=true" >> "$GITHUB_OUTPUT";;
            *) echo "::error::lane must be macos, linux or both"; exit 1;;
          esac
          case "$SHARDS" in ''|*[!0-9]*) SHARDS=4;; esac
          [ "$SHARDS" -lt 1 ] && SHARDS=1; [ "$SHARDS" -gt 20 ] && SHARDS=20
          echo "shards=$(python3 -c "import json; print(json.dumps(list(range($SHARDS))))")" >> "$GITHUB_OUTPUT"
          echo "plates_key=renderlab-plates-v1-${{ hashFiles('renderlab/photos.tsv', 'Sources/LumenPipeline/AppleRawSource.swift', 'Sources/LumenCore/RenderLab/RenderLabPlate.swift', 'Tests/LumenPipelineTests/RenderLabShippingHarness.swift') }}-$PLATE_EDGE" >> "$GITHUB_OUTPUT"
          echo "photo_ids=$(cut -d';' -f1 renderlab/photos.tsv | paste -sd, -)" >> "$GITHUB_OUTPUT"
          echo "Manifests: $list  lane: $LANE  shards: $SHARDS"
      - name: Are plates cached
        id: lookup
        uses: actions/cache/restore@v4
        with:
          path: renderlab-plates
          key: ${{ steps.m.outputs.plates_key }}
          lookup-only: true
          enableCrossOsArchive: true
      - uses: actions/upload-artifact@v4
        with:
          name: renderlab-manifests
          path: resolved/
          retention-days: 7

  # Decodes each photo once through AppleRawSource into scene-linear plates for Linux.
  plates:
    needs: plan
    if: needs.plan.outputs.linux == 'true' && (needs.plan.outputs.plates-hit != 'true' || inputs.plates)
    runs-on: ${{ inputs.runs-on || 'macos-15' }}
    timeout-minutes: 60
    env:
      PHOTOS: ${{ github.workspace }}/.renderlab-photos
    steps:
      - uses: actions/checkout@v4
      - name: Cache photos
        uses: actions/cache@v4
        with:
          path: .renderlab-photos
          key: renderlab-photos-v1-${{ hashFiles('renderlab/photos.tsv') }}
      - name: Fetch photos (sha256 verified)
        shell: bash
        run: bash renderlab/fetch-photos.sh renderlab/photos.tsv "$PHOTOS"
      - name: Cache the build for this commit
        uses: actions/cache@v4
        with:
          path: .build
          key: renderlab-build-${{ runner.os }}-${{ github.sha }}
          restore-keys: renderlab-build-${{ runner.os }}-
      - name: Build (release, with tests)
        shell: bash
        run: |
          start=$(date +%s)
          set +e
          swift build -c release --build-tests > build.log 2>&1
          status=$?
          grep -E "error:" build.log | sed "s#$GITHUB_WORKSPACE/##" | sort -u | head -40
          echo "build seconds: $(( $(date +%s) - start ))" | tee -a "$GITHUB_STEP_SUMMARY"
          exit $status
      - name: Decode plates
        shell: bash
        env:
          LUMEN_RENDERLAB_PHOTOS: ${{ env.PHOTOS }}
          LUMEN_RENDERLAB_PLATES_OUT: ${{ github.workspace }}/renderlab-plates
          LUMEN_RENDERLAB_PLATE_IDS: ${{ needs.plan.outputs.photo-ids }}
          LUMEN_RENDERLAB_PLATE_EDGE: ${{ env.PLATE_EDGE }}
        run: |
          set -o pipefail
          swift test -c release --skip-build --filter RenderLabShippingHarness/testWriteDecodedPlates 2>&1 \
            | grep -E "renderlab-plate|error|Executed"
          ls -la renderlab-plates
      - uses: actions/cache/save@v4
        with:
          path: renderlab-plates
          key: ${{ needs.plan.outputs.plates-key }}
          enableCrossOsArchive: true
      - uses: actions/upload-artifact@v4
        with:
          name: renderlab-plates
          path: renderlab-plates/
          retention-days: 30
          compression-level: 1

  shipping:
    needs: plan
    if: needs.plan.outputs.macos == 'true' || inputs.drift != ''
    runs-on: ${{ inputs.runs-on || 'macos-15' }}
    timeout-minutes: 120
    env:
      PHOTOS: ${{ github.workspace }}/.renderlab-photos
    steps:
      - uses: actions/checkout@v4
      - name: Cache photos
        uses: actions/cache@v4
        with:
          path: .renderlab-photos
          key: renderlab-photos-v1-${{ hashFiles('renderlab/photos.tsv') }}
      - name: Fetch photos (sha256 verified)
        shell: bash
        run: bash renderlab/fetch-photos.sh renderlab/photos.tsv "$PHOTOS"
      - name: Cache the build for this commit
        uses: actions/cache@v4
        with:
          path: .build
          key: renderlab-build-${{ runner.os }}-${{ github.sha }}
          restore-keys: renderlab-build-${{ runner.os }}-
      - name: Build (release, with tests)
        shell: bash
        run: |
          start=$(date +%s)
          set +e
          swift build -c release --build-tests > build.log 2>&1
          status=$?
          grep -E "error:" build.log | sed "s#$GITHUB_WORKSPACE/##" | sort -u | head -40
          echo "build seconds: $(( $(date +%s) - start ))" | tee -a "$GITHUB_STEP_SUMMARY"
          exit $status
      - uses: actions/download-artifact@v4
        with:
          name: renderlab-manifests
          path: resolved
      - name: Render on the shipping path
        if: needs.plan.outputs.macos == 'true'
        shell: bash
        env:
          LUMEN_RENDERLAB_PHOTOS: ${{ env.PHOTOS }}
          LUMEN_RENDERLAB_OUT: ${{ github.workspace }}/renderlab-out/shipping
          MANIFESTS: ${{ needs.plan.outputs.manifests }}
        run: |
          list=""
          IFS=',' read -ra parts <<< "$MANIFESTS"
          for n in "${parts[@]}"; do list="${list:+$list,}$PWD/resolved/$n.json"; done
          start=$(date +%s)
          set +e
          LUMEN_RENDERLAB="$list" swift test -c release --skip-build \
            --filter RenderLabShippingHarness/testRunManifestOnTheShippingPath > lab.log 2>&1
          status=$?
          grep -E "^renderlab: |error:" lab.log | grep -v "RENDERLAB_TABLE" | tail -400
          echo "render seconds: $(( $(date +%s) - start ))" | tee -a "$GITHUB_STEP_SUMMARY"
          python3 renderlab/lab.py table renderlab-out/shipping | tee -a "$GITHUB_STEP_SUMMARY"
          exit $status
      - name: Reference against shipping drift
        if: inputs.drift != ''
        shell: bash
        env:
          LUMEN_RENDERLAB_PHOTOS: ${{ env.PHOTOS }}
          LUMEN_RENDERLAB_OUT: ${{ github.workspace }}/renderlab-out
          LUMEN_RENDERLAB_PLATE_EDGE: ${{ env.PLATE_EDGE }}
          DRIFT: ${{ inputs.drift }}
        run: |
          case "$DRIFT" in *[!A-Za-z0-9._-]*) echo "bad name"; exit 1;; esac
          f="resolved/$DRIFT.json"; [ -f "$f" ] || f="renderlab/manifests/$DRIFT.json"
          set +e
          LUMEN_RENDERLAB_DRIFT="$PWD/$f" swift test -c release --skip-build \
            --filter RenderLabShippingHarness/testReferenceAgainstShippingDrift > drift.log 2>&1
          status=$?
          sed -n '/RENDERLAB_DRIFT_BEGIN/,/RENDERLAB_DRIFT_END/p' drift.log | tee -a "$GITHUB_STEP_SUMMARY"
          grep -E "error:" drift.log | head -20
          exit $status
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: renderlab-shipping
          path: |
            renderlab-out/
            lab.log
            drift.log
          if-no-files-found: warn
          retention-days: 14

  reference:
    needs: [plan, plates]
    if: always() && needs.plan.outputs.linux == 'true' && needs.plan.result == 'success' && needs.plates.result != 'failure'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - name: Cache the Swift toolchain
        id: swift-cache
        uses: actions/cache@v4
        with:
          path: /opt/swift
          key: swift-6.1.2-ubuntu24.04
      - name: Install the Swift toolchain
        if: steps.swift-cache.outputs.cache-hit != 'true'
        run: sh scripts/install-linux-toolchain.sh
      - name: Restore plates
        uses: actions/cache/restore@v4
        with:
          path: renderlab-plates
          key: ${{ needs.plan.outputs.plates-key }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - name: Cache the build for this commit
        uses: actions/cache@v4
        with:
          path: .build
          key: renderlab-build-${{ runner.os }}-${{ github.sha }}
          restore-keys: renderlab-build-${{ runner.os }}-
      - name: Build (release, with tests)
        shell: bash
        run: |
          export PATH="/opt/swift/usr/bin:$PATH"
          start=$(date +%s)
          set +e
          swift build -c release --build-tests > build.log 2>&1
          status=$?
          grep -E "error:" build.log | sed "s#$GITHUB_WORKSPACE/##" | sort -u | head -40
          echo "build seconds: $(( $(date +%s) - start ))"
          exit $status
      - uses: actions/download-artifact@v4
        with:
          name: renderlab-manifests
          path: resolved
      - name: Render on the reference path (shard ${{ matrix.shard }})
        shell: bash
        env:
          LUMEN_RENDERLAB_PLATES: ${{ github.workspace }}/renderlab-plates
          LUMEN_RENDERLAB_OUT: ${{ github.workspace }}/renderlab-out/reference
          LUMEN_RENDERLAB_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
          MANIFESTS: ${{ needs.plan.outputs.manifests }}
        run: |
          export PATH="/opt/swift/usr/bin:$PATH"
          list=""
          IFS=',' read -ra parts <<< "$MANIFESTS"
          for n in "${parts[@]}"; do list="${list:+$list,}$PWD/resolved/$n.json"; done
          start=$(date +%s)
          set +e
          LUMEN_RENDERLAB="$list" swift test -c release --skip-build \
            --filter RenderLabReferenceHarness > lab.log 2>&1
          status=$?
          grep -E "^renderlab: |error:" lab.log | tail -300
          echo "render seconds: $(( $(date +%s) - start )) on $(nproc) cores"
          python3 renderlab/lab.py compress renderlab-out/reference
          exit $status
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: renderlab-reference-shard-${{ matrix.shard }}
          path: |
            renderlab-out/
            lab.log
          if-no-files-found: warn
          retention-days: 7

  report:
    needs: [plan, shipping, reference]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: renderlab-*-shard-*
          path: shards
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: renderlab-shipping
          path: shipping
      - name: Merge into one report
        shell: bash
        run: |
          python3 renderlab/lab.py merge report shards/*/renderlab-out shipping/renderlab-out
          python3 renderlab/lab.py table report | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: renderlab-report
          path: report/
          retention-days: 14
