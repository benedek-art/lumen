# The control-sweep drift check (docs/20) on Linux: all 144 registered controls at 21
# settings, compared against the committed records.
#
# ci.yml's test-fast already sweeps all 144 controls in release on macOS, as part of the
# complete suite, on every PR and main push. This workflow adds the same sweep under the
# Linux toolchain and glibc arithmetic: on main pushes and PRs that touch the engine,
# the proof harness or the build settings; nightly on main (GitHub fires schedules only
# on the default branch); and on dispatch, in debug or as a re-record. ProofSmokeTests
# inside engine-linux remains the fast Linux tripwire: eight sentinel controls.
#
# The former debug sweep took 66–80 minutes and was often cancelled by the next push.
# Release optimization exercises the shipping arithmetic without shrinking the registry
# or its 21-setting sweeps. Debug remains a manual diagnostic option.
name: Proof sweep
on:
  push:
    # main and long-lived integration branches (e.g. `denoise`, which PRs target).
    # Agent feature branches are tested through their pull request instead.
    branches-ignore: ["claude/**", "codex/**"]
    paths:
      - "Sources/LumenCore/**"
      # THE TWO THAT WERE MISSING, and the gap they left. The sweep renders through
      # `ReferenceRenderer`, which lives in LumenCore — so the paths list described where
      # the RENDERER lives rather than where a control's behaviour can be changed from.
      # `LumenPipeline` holds the shipping graph and every kernel; `LumenApp` holds the
      # panels that decide what a slider writes and over what range. A change to either
      # can move what a control does to a photograph, and neither fired this lane.
      #
      # The full sweep has its own concurrency group and never blocks `ci.yml`.
      # Release optimization changes execution cost, not coverage or drift tolerances.
      - "Sources/LumenPipeline/**"
      - "Sources/LumenApp/**"
      - "Tests/LumenCoreTests/Proof/**"
      # Build settings, target excludes and resources in Package.swift change what the
      # release sweep compiles and reads; CSQLite3 is LumenCore's Linux dependency.
      - "Package.swift"
      - "Sources/CSQLite3/**"
      - "scripts/install-linux-toolchain.sh"
      - ".github/workflows/proof.yml"
  # A PR run tests the merge with its base. Same paths as push.
  pull_request:
    paths:
      - "Sources/LumenCore/**"
      - "Sources/LumenPipeline/**"
      - "Sources/LumenApp/**"
      - "Tests/LumenCoreTests/Proof/**"
      - "Package.swift"
      - "Sources/CSQLite3/**"
      - "scripts/install-linux-toolchain.sh"
      - ".github/workflows/proof.yml"
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:
    inputs:
      configuration:
        description: 'Build configuration for the complete proof sweep'
        type: choice
        options: [release, debug]
        default: release
      record_proofs:
        description: >-
          Re-record the committed proof records instead of checking them. Use after a
          DELIBERATE behaviour change, then download the `proof-records-linux` artifact
          and commit what it contains. The drift test is what makes an accidental
          change visible, so this must never run on a push.
        type: boolean
        default: false

concurrency:
  group: proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The drift check docs/20 describes: every registered control swept at 21 settings,
  # measured in sRGB code values, compared against the records committed under
  # `Tests/LumenCoreTests/Proof/records`. A number that moves here is either a fix or a
  # regression and the commit message has to say which — which is the whole point of
  # committing them, since every defect docs/19 found was invisible until somebody
  # thought to measure and none would have surfaced in a code review.
  #
  # Each setting still bakes the full 65-cubed colour cube. The optimizer is the
  # useful cost lever: the unchanged optimized 144-control suite passed locally in
  # 184 seconds, and hosted Linux/macOS full-registry snapshots agreed with the ruler.
  # That is evidence for release coverage, not a promised hosted runtime. Keep the
  # complete registry; LUT3D already parallelizes each bake, so adding an outer fleet
  # would oversubscribe the runner.
  proof-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      # Keyed on the install script's VERSION, as in ci.yml's engine-linux, so a bump
      # misses the cache instead of restoring the old toolchain.
      - name: Toolchain version from the install script
        id: swift-version
        run: |
          v=$(sed -n 's/^VERSION="\${SWIFT_VERSION:-\([0-9.]*\)}".*/\1/p' scripts/install-linux-toolchain.sh)
          [ -n "$v" ] || { echo "::error::no VERSION in scripts/install-linux-toolchain.sh"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Cache the Swift toolchain
        id: swift-cache
        uses: actions/cache@v4
        with:
          path: /opt/swift
          key: swift-${{ steps.swift-version.outputs.version }}-ubuntu24.04
      - name: Install the Swift toolchain
        if: steps.swift-cache.outputs.cache-hit != 'true'
        run: sh scripts/install-linux-toolchain.sh
      - name: The installed toolchain is the one the script names
        run: /opt/swift/usr/bin/swift --version 2>&1 | grep -F "Swift version ${{ steps.swift-version.outputs.version }} "
      - name: Every registered control still measures what the record says
        shell: bash
        env:
          # Set to '1' only by a manual dispatch asking for it. On a push the
          # expression yields the empty string, WHICH GITHUB STILL SETS — and that is
          # fine now, because `ControlProofTests.isRecording` refuses empty (and "0",
          # "false", "no", "off") since 62f301c. The guard lives in the Swift, not in
          # this file: the silent-re-record incident (run 181 reported no drift while
          # tone.exposure measured 251.54 against a committed 169.07) was the pairing
          # of THIS empty string with a Swift check that read mere presence as yes.
          #
          # Do NOT move this expression into the `run:` script instead. That was tried
          # in 62f301c — `if [ "${{ inputs.record_proofs }}" = "true" ]` inline — and
          # GitHub refused to create jobs for the whole workflow: runs 182, 183 and 184
          # each report "failure" with ZERO jobs, created and completed in the same
          # second, while a one-job canary workflow on the same push ran fine. The YAML
          # parses; the run-creation service rejects it anyway. This env: form had run
          # 181 times before the change.
          LUMEN_RECORD_PROOFS: ${{ inputs.record_proofs && '1' || '' }}
          # Push/nightly always use release; only a manual dispatch can choose debug.
          PROOF_CONFIGURATION: ${{ github.event_name == 'workflow_dispatch' && inputs.configuration || 'release' }}
        run: |
          export PATH="/opt/swift/usr/bin:$PATH"
          case "$PROOF_CONFIGURATION" in
            release|debug) ;;
            *) echo "Unsupported proof build configuration" >&2; exit 1 ;;
          esac
          echo "Full proof sweep configuration: $PROOF_CONFIGURATION"
          if [ "$LUMEN_RECORD_PROOFS" = "1" ]; then
            echo "RECORDING — this run rewrites the records and proves nothing."
          fi
          set +e
          swift test -c "$PROOF_CONFIGURATION" --filter ControlProofTests 2>&1 | tee proof.log
          # `$?` and not `${PIPESTATUS[0]}` because GitHub runs `shell: bash` as
          # `bash --noprofile --norc -eo pipefail`, so the pipeline already carries the
          # first non-zero status and `set +e` above turns off errexit without touching
          # pipefail. Checked rather than assumed: this construct is what reported
          # engine-linux's three failures on run 178.
          status=$?
          echo "=== measured authority ==="
          sed -n '/control authority/,/^$/p' proof.log | head -200
          echo "=== failures ==="
          # `: error: ` and NOT `: error: -\[`. The bracketed form is Apple XCTest's
          # `-[Class testName]`; swift-corelibs-xctest writes `Class.testName : XCT...`
          # with no brackets at all. This job runs on ubuntu, so the old pattern matched
          # NOTHING here and every failing sweep printed an empty failures list under a
          # non-zero exit — a ceremony that says a control moved and refuses to say
          # which. Run 33723153890 is the example: 135 evidence sheets, exit 1, and no
          # diagnosis. Both formats carry `: error: `, and the `sed` strips whatever
          # precedes it either way.
          # `-A 40`, not 12, and a `head` well past one block. The assertion message is
          # MULTI-LINE and it EMBEDS THE COMPLETE NEW JSON for every control that moved —
          # deliberately, so a considered change can be committed straight out of a red
          # run's log (`ControlProofTests.recordJSON`). A record is about fifteen lines,
          # so `-A 12` cut the first one off mid-JSON and hid every control after it.
          # This lane failed unreadably twice in one night: first because the pattern was
          # Apple XCTest's and the runner is Ubuntu, then because the window was shorter
          # than the thing it was quoting. A summary that names one mover and truncates
          # the rest is the same defect wearing a smaller number. The `sed` only rewrites
          # the first line of each block; continuation lines pass through as they are.
          grep -A 40 -E ": error: " proof.log | sed 's/^.*error: //' | head -400
          exit $status
      - name: Keep the evidence sheets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proof-evidence-linux
          path: Tests/LumenCoreTests/Proof/evidence/
          if-no-files-found: ignore
          retention-days: 14
      - name: Keep the re-recorded records
        if: ${{ always() && inputs.record_proofs }}
        uses: actions/upload-artifact@v4
        with:
          name: proof-records-linux
          path: Tests/LumenCoreTests/Proof/records/
          if-no-files-found: error
          retention-days: 14
