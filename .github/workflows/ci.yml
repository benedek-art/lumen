name: CI

permissions:
  contents: read

on:
  # Pull requests against any base, and pushes to every branch except agent feature
  # branches (claude/**, codex/**). A pull_request run checks out the MERGE of the
  # branch with its base, so two PRs that are each green on their own branch but break
  # main together are caught before the second one lands. Agent branches are not also
  # run on push: every PR branch would otherwise run the whole macOS fleet twice per
  # push. The cost is that an agent branch with no open PR gets no CI until a PR is
  # opened or the workflow is dispatched on it. main and integration branches such as
  # `denoise` (which PRs target) still run on push.
  # merge_group is inert until a merge queue is turned on; it is here so turning one
  # on needs no workflow change.
  push:
    # main and long-lived integration branches (e.g. `denoise`, which PRs target).
    # Agent feature branches are tested through their pull request instead.
    branches-ignore: ["claude/**", "codex/**"]
    # A push that touches only prose must not cancel the run that is compiling the
    # code. The concurrency group below is per ref and cancels in progress, which
    # is right for a burst of code pushes and wrong for a status note pushed while a
    # kernel fix is halfway through test-fast — that note cancelled the fix's run and,
    # with it, the app-bundle that would have replaced a build drawing masks upside
    # down. Docs-only pushes start no run; the dev release is unchanged by them anyway.
    #
    # Except docs/28-ui-refresh.md: WorkspaceTests.testTheWorkspaceTableInDocs28-
    # StillDescribesThisModel reads its §5.1 table at test time, so an edit to that
    # file alone can turn the suite red. The later positive pattern re-includes it.
    paths:
      - "**"
      - "!docs/**"
      - "docs/28-ui-refresh.md"
  pull_request:
    paths:
      - "**"
      - "!docs/**"
      - "docs/28-ui-refresh.md"
  merge_group:
  # Re-recording proof records moved to proof.yml's dispatch, with the control sweep
  # itself; the GPU goldens moved to gpu-parity.yml, which triggers itself on the
  # paths that can break parity instead of waiting for a human who never came.
  workflow_dispatch:
    inputs:
      publish_validated_release:
        description: "Publish after completing the documented RAW and native UI qualification"
        type: boolean
        required: false
        default: false

# One run per ref (a pull request's runs share refs/pull/N/merge). macOS runners are
# scarce and the suite takes ten minutes, so a burst of pushes queues rounds whose answers nobody will read by the time they land —
# and the newest push, the only one that matters, waits behind all of them.
concurrency:
  # Qualification dispatches serialize separately: a new push must not cancel a
  # publisher halfway through release/tag promotion. Ordinary builds still cancel.
  group: ci-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.publish_validated_release && 'release' || 'validation' }}
  cancel-in-progress: ${{ !(github.event_name == 'workflow_dispatch' && inputs.publish_validated_release) }}

jobs:
  # Compile every target on macOS. LumenPipeline and LumenApp are `#if os(macOS)` and
  # need Core Image, AppKit and SwiftUI, so only macOS runners type-check them. This is
  # the fast compile gate, reporting build errors and warnings on their own; test-fast
  # below runs the complete optimized suite on macOS, and engine-linux runs LumenCore's
  # tests on Linux. macOS minutes are the scarce resource on this project — a private
  # repo ran out of them once and seventy commits went uncompiled behind the outage.
  build-macos:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Release safety policy and negative controls
        run: ruby scripts/check-release-policy.rb
      - name: Toolchain
        run: swift --version && xcodebuild -version
      - name: Build — whole package including the app
        shell: bash
        run: |
          set +e
          swift build > build.log 2>&1
          status=$?
          echo "=== errors ==="
          grep -E "error:" build.log | sed 's#/Users/runner/work/lumen/lumen/##' | sort -u | head -80
          echo "=== warnings ==="
          grep -E "warning:" build.log | sed 's#/Users/runner/work/lumen/lumen/##' | sort -u | head -30
          exit $status

  # Keep the legacy job name because release policy requires this check. Run the
  # complete optimized macOS suite on every push: it covers the shipping optimizer
  # and all pipeline tests without filters. Independent GPU and Linux debug lanes
  # remain complementary checks. Keep the existing 35-minute ceiling; hosted runs
  # determine whether the full suite completes within it.
  #
  # A skipped test reads as green, so the step also fails on any skip that
  # .github/expected-skips.txt does not list (the environment-gated corpus, bench and
  # probe tests), via scripts/check-xctest-skips.py. A kernel that fails to compile
  # surfaces as a skip (the GPU goldens gate on kernel availability).
  test-fast:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Complete optimized macOS suite
        shell: bash
        run: |
          set +e
          swift test -c release 2>&1 | tee fast.log
          status=$?
          echo "=== compile errors ==="
          grep -E "error:" fast.log | grep -v ": error: -\[" \
            | sed 's#/Users/runner/work/lumen/lumen/##' | sort -u | head -40
          echo "=== summary ==="
          grep -E "Executed [0-9]+ test" fast.log | tail -1
          echo "=== failing tests ==="
          grep -E ": error: -\[" fast.log \
            | sed -E 's/^.*error: -\[([^]]*)\].*/\1/' | sort | uniq -c | sort -rn | head -30
          echo "=== first failures per test ==="
          grep -E ": error: -\[" fast.log | sed 's#/Users/runner/work/lumen/lumen/##' \
            | sed 's/^.*error: //' \
            | awk '{ key = $1 " " $2; if (seen[key]++ < 2) print }' | head -40
          python3 scripts/check-xctest-skips.py fast.log || status=1
          exit $status

  # The thing a photographer can actually open. Runs on every push regardless of the
  # test lane's verdict, because a build you can launch and poke at is how you find
  # out what the tests are not asking about.
  app-bundle:
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Build Lumen.app
        run: scripts/build-app.sh
      - name: Zip it
        # Ditto, not zip: `zip` does not preserve the bundle's symlinks or the ad-hoc
        # signature, and an app that fails Gatekeeper because the archiver mangled it
        # looks exactly like an app that is broken.
        run: ditto -c -k --sequesterRsrc --keepParent dist/Lumen.app Lumen.app.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Lumen-app
          path: Lumen.app.zip
          retention-days: 30

  # An update is not a test artifact. This is a second run of the same unfiltered
  # optimized suite as test-fast, on main only, kept as the separately named release
  # gate that scripts/check-release-policy.rb requires of publish-release. test-fast
  # has had no exclusions since 8ee85b8, so this adds no coverage and costs one more
  # macOS runner per main push; dropping it means changing the release policy first.
  # Failed, skipped or cancelled prerequisites leave the existing release alone.
  release-validation:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Complete optimized suite (release gate)
        run: swift test -c release

  publish-release:
    needs: [app-bundle, build-macos, test-fast, fixtures-linux, engine-linux, release-validation]
    if: success() && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.publish_validated_release == true
    runs-on: macos-15
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Lumen-app
      - name: Refuse to publish anything but the current tip of main
        # `cancel-in-progress` keeps two LIVE runs from racing, and nothing else here
        # does: a manual "Re-run jobs" on an old, green main run passes every gate
        # above with the old commit and would push it out as `dev-latest`. The updater
        # then sees a "new" release whose build is older than the one installed copies
        # already run. So the publisher asks the remote where main is NOW and refuses
        # unless that is the commit this run built. An empty answer refuses too.
        run: |
          TIP=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ -z "$TIP" ] || [ "$TIP" != "$GITHUB_SHA" ]; then
            echo "::error::This run built ${GITHUB_SHA}, but main is at ${TIP:-an unknown commit}. Refusing to publish an older build as dev-latest."
            exit 1
          fi
      - name: Stage, verify and promote the qualified release
        # The script preserves the existing release and its prior asset. The updater
        # still reads commit: <sha>, sha256: <digest> and exactly Lumen.app.zip.
        env:
          GH_TOKEN: ${{ github.token }}
          LUMEN_PUBLISH_QUALIFIED: 'true'
        run: python3 scripts/publish-staged-release.py
      - name: Preserve release recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-recovery.json
          if-no-files-found: ignore


  # Linux lane: recompute every fixture with the Python reference and fail if the
  # committed fixtures no longer agree with it.
  fixtures-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install reference deps
        run: pip install xxhash
      - name: Fixtures must still match the committed state
        # --check recomputes everything and compares numerically rather than writing.
        #
        # The gate here used to be `git diff --exit-code` over regenerated output,
        # which made it a bit-exactness test of double arithmetic across machines —
        # and nothing guarantees that. glibc dispatches exp/log/pow to FMA-using
        # variants when the CPU has FMA, so the same glibc version on a different
        # runner returns results a few ulp apart: this lane failed on 163 values in
        # enginemath.json whose worst deviation was 8e-15 relative, with no change to
        # the engine at all. The tolerance --check uses is documented in the script
        # and is six orders of magnitude below anything a real change produces.
        run: python3 scripts/gen-fixtures.py --check
      - name: Exercise release promotion and recovery offline
        run: python3 scripts/test-publish-staged-release.py

      # Six mechanical passes over the Swift, on the lane that has no Swift. Not a
      # type checker and no substitute for the macOS build — it catches undeclared
      # identifiers, call sites whose labels match no declared or MEMBERWISE
      # initializer (the synthesized half arrived with docs/31's postscript: 170 app
      # types declare no init, and every call to them went unchecked), actor
      # members called without await, TypeName.member references naming nothing, and
      # platform symbols used in a file that does not import their module, and members
      # read off a value whose declared type does not have them. It costs seconds and it
      # is the only feedback on the Swift at all when the macOS runner cannot start.
      - name: Swift surface — symbols, inits, await, members, imports, targets, values, scopes
        run: python3 scripts/check-swift-surface.py

      # The guard on the guard (docs/31 postscript). Known-good and known-bad fixture
      # trees run through the checker above, and the known-bad set includes the exact
      # false negative it shipped — a memberwise call with its labels out of order and
      # a multi-line ternary argument. The runner asserts each planted defect is
      # reported BY NAME, so a fixture cannot fail for the wrong reason and read as
      # caught; a reopened hole fails this step even while the step above stays green.
      - name: Swift surface — the checker's own fixture suite
        run: python3 scripts/test-check-swift-surface.py

      # Which verdict file speaks for a control when two carry the same id: the one
      # named `<id>.json`, never whichever sorts first (V7 D9).
      - name: Slider atlas generator — canonical verdict file wins
        run: python3 scripts/test-gen-slider-atlas.py

      # The skip guard test-fast and gpu-parity run: both log formats, the exit status,
      # and that every allowlisted name is still a test.
      - name: XCTest skip guard and its allowlist
        run: python3 scripts/test-check-xctest-skips.py

      # A skip outlives the test it skips silently: test-fast carried
      # `--skip testExportTableErrorStaysUnderOnePercent` for days after 1bca87f renamed
      # that test away, and an orphaned skip quietly stops a test that is later renamed
      # INTO its name. Today the only one is engine-linux's `--skip ControlProofTests`.
      # Capitalised names must be a class, others a func.
      - name: Every --skip in the workflows still names a test that exists
        shell: bash
        run: |
          fail=0
          # Comment and step-name lines mention --skip in prose; only commands count.
          for name in $(grep -hvE '^[[:space:]]*(#|- name:)' .github/workflows/*.yml \
                          | grep -oE -- '--skip[ =][A-Za-z][A-Za-z0-9_./]*' \
                          | sed -E 's/^--skip[ =]//' | sort -u); do
            last=${name##*[./]}
            case "$last" in
              [A-Z]*) pattern="class $last\b" ;;
              *) pattern="func $last\(" ;;
            esac
            echo "--skip $name"
            grep -rqE "$pattern" Tests/ || { echo "orphaned skip: $name"; fail=1; }
          done
          exit $fail


  # The engine suite, on the lane that costs nothing. LumenCore is pure Swift — colour
  # science, tone, grade, film, detail, denoise, mask algebra, catalog and XMP — with no
  # Apple framework anywhere in it, so its whole suite runs here in a few minutes on a
  # runner that is not rationed. (No count in this comment on purpose: two previous
  # counts here went stale within days. The test log is the count.)
  #
  # The catalog is included only because `Sources/CSQLite3` exists: Ubuntu ships a header
  # and a shared object and no modulemap, so `canImport(SQLite3)` was FALSE here and
  # `CatalogStore` and every one of its tests compiled out. A green run that had never
  # built a third of LumenCore is the same shape as a check that cannot fail.
  #
  # What this lane does NOT cover, stated so nobody reads it as more than it is:
  # LumenPipeline and LumenApp never compile here, and the macOS-side behaviour of
  # LumenCore (the SDK's own SQLite3 module rather than the shim) is covered by
  # test-fast, which runs the complete suite on macos-15.
  engine-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # The cache key is the install script's VERSION, so bumping it misses the cache
      # and installs the new toolchain instead of restoring the old one.
      - name: Toolchain version from the install script
        id: swift-version
        run: |
          v=$(sed -n 's/^VERSION="\${SWIFT_VERSION:-\([0-9.]*\)}".*/\1/p' scripts/install-linux-toolchain.sh)
          [ -n "$v" ] || { echo "::error::no VERSION in scripts/install-linux-toolchain.sh"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Cache the Swift toolchain
        id: swift-cache
        uses: actions/cache@v4
        with:
          path: /opt/swift
          key: swift-${{ steps.swift-version.outputs.version }}-ubuntu24.04
      - name: Install the Swift toolchain
        if: steps.swift-cache.outputs.cache-hit != 'true'
        run: sh scripts/install-linux-toolchain.sh
      - name: The installed toolchain is the one the script names
        run: /opt/swift/usr/bin/swift --version 2>&1 | grep -F "Swift version ${{ steps.swift-version.outputs.version }} "
      # Parse every source file, INCLUDING the macOS-only ones. Runs BEFORE the suite
      # so a syntax break fails in seconds rather than after six minutes of tests.
      #
      # `swiftc -parse` reads inside `#if os(macOS)` on Linux, because parsing happens
      # before the condition is evaluated. So this sees LumenApp and LumenPipeline — two
      # thirds of the codebase that nothing else on a Linux runner can look at.
      #
      # It closes a hole `check-swift-surface.py` structurally cannot: that script is a
      # text tool, and on a file carrying a bare `when capture sharpening` fragment where
      # a declaration belonged it reported EXIT 0 while this rejects it at once. Two of
      # the three CI breaks on this branch today were exactly that class, each costing a
      # macOS round trip.
      #
      # What it does NOT do, so nobody reads it as more: no type checking, no protocol
      # conformance, no overload resolution, no name resolution. The third break today
      # was a conformance failure and this would have waved it through. `build-macos`
      # remains the only compiler that answers those.
      - name: Swift parse — every file, macOS-only ones included
        run: |
          export PATH="/opt/swift/usr/bin:$PATH"
          swiftc -parse -swift-version 5 $(find Sources -name '*.swift')

      - name: Test — the engine, without the control sweep
        shell: bash
        run: |
          export PATH="/opt/swift/usr/bin:$PATH"
          set +e
          # `ControlProofTests` is skipped here. It sweeps every registered control at
          # 21 settings, each baking a 65-cubed colour cube, and it pushed this job past
          # its own 25-minute timeout — a lane that is cancelled tells you nothing at
          # all, which is worse than a slow one. On Linux the full sweep runs in
          # proof.yml's `proof-linux` on pushes and PRs that touch its paths, nightly on
          # main and on dispatch; on macOS test-fast runs it with the rest of the suite.
          # ProofSmokeTests (eight sentinel controls) still runs here.
          #
          # `--parallel` is NOT here for speed. Without it this lane dies before it runs
          # a single test:
          #
          #   error: posix_spawn error: Argument list too long (7),
          #   `["...LumenPackageTests.xctest", "LumenCoreTests.AccuracyProbeTests/test..."
          #
          # Any `--filter` or `--skip` makes SwiftPM resolve the selection itself and
          # hand the xctest binary ONE comma-joined argument naming every matching test.
          # Linux caps a single argument at MAX_ARG_STRLEN, 128 KiB, and at roughly
          # eighteen hundred tests averaging seventy characters of suite-plus-method that
          # argument crossed it. The suite had been sitting just under the ceiling for a
          # while; a wave of new tests pushed it over, and the lane failed in fifty-one
          # seconds having compiled everything and run nothing.
          #
          # In parallel mode SwiftPM spawns per test instead of building that argument,
          # so the ceiling does not exist. That makes this the fix rather than a
          # workaround: the serial path fails as a function of how many tests we have,
          # which is a number that only goes up.
          swift test --parallel --filter LumenCoreTests --skip ControlProofTests \
            --xunit-output engine.xml 2>&1 | tee engine.log
          status=$?
          # Formats, checked against Swift 6.1.2 on Linux: a compiler error carries a
          # column (`File.swift:L:C: error:`); a swift-corelibs-xctest failure has none
          # and no `-[Class test]` brackets (`File.swift:L: error: Suite.test : ...`).
          # `--parallel` prints `[k/N] Testing Module.Suite/test` and replays only the
          # failing tests' own output, so there is no whole-run `Executed N tests`
          # line; the totals come from the xunit file.
          echo "=== compile errors ==="
          grep -E "\.swift:[0-9]+:[0-9]+: error:|^error:" engine.log \
            | sed "s#$PWD/##" | sort -u | head -40
          echo "=== summary ==="
          ran=$(grep -oE 'tests="[0-9]+"' engine.xml 2>/dev/null | head -1 | tr -dc 0-9)
          failed=$(grep -oE 'failures="[0-9]+"' engine.xml 2>/dev/null | head -1 | tr -dc 0-9)
          echo "ran ${ran:-0} tests, ${failed:-unknown} failed (engine.xml)"
          echo "=== failing tests ==="
          grep -E "\.swift:[0-9]+: error: " engine.log \
            | sed -E 's/^.*: error: ([^ ]+) : .*/\1/' | sort | uniq -c | sort -rn | head -20
          echo "=== first failures per test ==="
          grep -E "\.swift:[0-9]+: error: " engine.log | sed "s#$PWD/##" \
            | sed 's/^.*: error: //' \
            | awk '{ if (seen[$1]++ < 2) print }' | head -40
          # A target that compiles out (the CSQLite3 case above) is green with fewer
          # tests. The floor is the source's own `func test` count outside
          # ControlProofTests, less 2% for helpers and platform-gated tests.
          declared=$(grep -rhoE "func test[A-Za-z0-9_]*\(" Tests/LumenCoreTests \
            --include='*.swift' --exclude=ControlProofTests.swift | wc -l)
          floor=$((declared * 98 / 100))
          echo "=== test count: ${ran:-0} ran, ${declared} declared, floor ${floor} ==="
          if [ "$status" -eq 0 ] && [ "${ran:-0}" -lt "$floor" ]; then
            echo "::error::only ${ran:-0} engine tests ran; the source declares ${declared} (floor ${floor})"
            status=1
          fi
          exit $status
