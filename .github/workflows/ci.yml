name: CI

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  # The real thing: compile every target and RUN the suites on macOS. The engine's
  # goldens run first so their signal survives churn in the app layer.
  test-macos:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version && xcodebuild -version

      - name: Test — engine + GPU goldens
        run: swift test 2>&1 | tail -400

      - name: Build — whole package including the app
        if: always()
        run: swift build 2>&1 | tail -400

  # Linux lane: regenerate fixtures with the Python reference and fail if the
  # committed fixtures drifted from the verified reference.
  fixtures-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install reference deps
        run: pip install xxhash
      - name: Regenerate + self-verify fixtures
        run: python3 scripts/gen-fixtures.py
      - name: Fixtures must match committed state
        run: git diff --exit-code -- Tests/LumenCoreTests/Fixtures
