name: CI

# PUSH TRIGGER TEMPORARILY DISABLED — 2026-08-20.
#
# GitHub stopped allocating runners partway through the session: every run failed
# in about three seconds with no job ever starting, on the macOS AND the Linux
# lanes, with empty logs. That is the signature of exhausted Actions minutes or a
# hit spending limit, not of anything in this repository. Each failure emailed the
# repository owner, and a burst of pushes turned that into twenty emails about a
# problem no commit could fix.
#
# TO RESTORE once Actions can allocate runners again — raise the spending limit,
# or make the repository public, or wait for the monthly reset — delete this
# comment and put back:
#
#   push:
#     branches: ["**"]
#
# Until then the workflow still runs on demand from the Actions tab, which costs
# nothing while it cannot start.
on:
  workflow_dispatch:

# One run per branch. macOS runners are scarce and the suite takes ten minutes, so a
# burst of pushes queues rounds whose answers nobody will read by the time they land —
# and the newest push, the only one that matters, waits behind all of them.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The real thing: compile every target and RUN the suites on macOS. The engine's
  # goldens run first so their signal survives churn in the app layer.
  #
  # Each step writes its full output to a file and prints only the deduplicated
  # diagnostics. A Swift build repeats the same error once per compilation unit, and a
  # log where one warning appears forty times is a log nobody reads to the end.
  test-macos:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version && xcodebuild -version

      # Build FIRST. Running it after `swift test` compiled everything meant the
      # compiler had nothing left to do and re-emitted no diagnostics, so the warnings
      # section was empty whatever the code said — a green light wired to nothing.
      - name: Build — whole package including the app
        shell: bash
        run: |
          set +e
          swift build > build.log 2>&1
          status=$?
          echo "=== errors ==="
          grep -E "error:" build.log | sed 's#/Users/runner/work/lumen/lumen/##' | sort -u | head -80
          echo "=== warnings ==="
          grep -E "warning:" build.log | sed 's#/Users/runner/work/lumen/lumen/##' | sort -u | head -30
          exit $status

      - name: Test — engine + GPU goldens
        if: always()
        shell: bash
        run: |
          set +e
          swift test > test.log 2>&1
          status=$?
          echo "=== compile errors ==="
          grep -E "error:" test.log | grep -v ": error: -\[" \
            | sed 's#/Users/runner/work/lumen/lumen/##' | sort -u | head -40
          echo "=== summary ==="
          grep -E "Executed [0-9]+ test" test.log | tail -1
          # Which TESTS failed, before what they said. One test can fail a hundred
          # assertions inside a loop, and a list deduplicated by message is then a
          # hundred near-identical lines that hide every other failing test.
          echo "=== failing tests ==="
          grep -E ": error: -\[" test.log \
            | sed -E 's/^.*error: -\[([^]]*)\].*/\1/' | sort | uniq -c | sort -rn | head -20
          # Failures print LAST so a short tail of the CI log always reaches them.
          # Two examples per test is enough to see the shape of the problem.
          echo "=== first failures per test ==="
          grep -E ": error: -\[" test.log | sed 's#/Users/runner/work/lumen/lumen/##' \
            | sed 's/^.*error: //' \
            | awk '{ key = $1; if (seen[key]++ < 2) print }' | head -24
          exit $status

  # The thing a photographer can actually open. Runs on every push regardless of the
  # test lane's verdict, because a build you can launch and poke at is how you find
  # out what the tests are not asking about.
  app-bundle:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build Lumen.app
        run: scripts/build-app.sh
      - name: Zip it
        # Ditto, not zip: `zip` does not preserve the bundle's symlinks or the ad-hoc
        # signature, and an app that fails Gatekeeper because the archiver mangled it
        # looks exactly like an app that is broken.
        run: ditto -c -k --sequesterRsrc --keepParent dist/Lumen.app Lumen.app.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Lumen-app
          path: Lumen.app.zip
          retention-days: 30

  # Linux lane: regenerate fixtures with the Python reference and fail if the
  # committed fixtures drifted from the verified reference.
  fixtures-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install reference deps
        run: pip install xxhash
      - name: Regenerate + self-verify fixtures
        run: python3 scripts/gen-fixtures.py
      - name: Fixtures must match committed state
        run: git diff --exit-code -- Tests/LumenCoreTests/Fixtures
