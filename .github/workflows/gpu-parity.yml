# The lane that answers "does the GPU still agree with the mathematics" — the two
# whole-graph parity goldens plus every kernel golden in LumenPipelineTests.
#
# This exists because its predecessor, a dispatch-only job inside ci.yml, was NEVER
# dispatched: not once in the project's history. Eleven commits touched
# Sources/LumenPipeline in the window where nothing ran it, one of them changing a blur
# radius by a factor of three. A lane that requires a human at the Actions tab does not
# run, so this one triggers itself on exactly the pushes that can break parity — and
# its own file is in the paths so the push that lands a lane change also exercises it.
#
# ci.yml's test-fast already runs these tests on every PR, in release. This lane runs
# them in DEBUG, where `assert` is live (`precondition` is live in both) and the code
# is unoptimized. That is what it adds; floating-point results should not differ.
name: GPU parity
on:
  # Same triggers as ci.yml: pull requests against any base (a PR run tests the merge
  # with its base) and pushes to every branch except agent feature branches, so a PR
  # does not start this macOS run twice.
  #
  # Pipeline, engine and their tests only. Compile errors elsewhere in Sources (runs #13
  # and #14 died on LumenApp errors) are build-macos's to report; `swift test` still
  # builds the whole package here, so such an error also fails this lane when it runs.
  push:
    # main and long-lived integration branches (e.g. `denoise`, which PRs target).
    # Agent feature branches are tested through their pull request instead.
    branches-ignore: ["claude/**", "codex/**"]
    paths:
      - "Sources/LumenPipeline/**"
      - "Sources/LumenCore/**"
      - "Tests/LumenPipelineTests/**"
      - "Package.swift"
      - ".github/expected-skips.txt"
      - "scripts/check-xctest-skips.py"
      - ".github/workflows/gpu-parity.yml"
  pull_request:
    paths:
      - "Sources/LumenPipeline/**"
      - "Sources/LumenCore/**"
      - "Tests/LumenPipelineTests/**"
      - "Package.swift"
      - ".github/expected-skips.txt"
      - "scripts/check-xctest-skips.py"
      - ".github/workflows/gpu-parity.yml"
  workflow_dispatch:

concurrency:
  group: gpu-parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gpu-parity:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # The check that every `--skip` in the workflows still names a test moved to
      # ci.yml's fixtures-linux: it is a grep and needs no macOS runner.
      - name: Every pipeline golden, the whole-graph parity pair included
        shell: bash
        run: |
          set +e
          swift test --filter LumenPipelineTests 2>&1 | tee parity.log
          # `$?` and not `${PIPESTATUS[0]}`: GitHub runs `shell: bash` with pipefail on,
          # and `set +e` turns off errexit without touching it. Same construct, same
          # reasoning, as the proof lane.
          status=$?
          echo "=== summary ==="
          grep -E "Executed [0-9]+ test" parity.log | tail -1
          echo "=== failing tests ==="
          grep -E ": error: -\[" parity.log \
            | sed -E 's/^.*error: -\[([^]]*)\].*/\1/' | sort | uniq -c | sort -rn | head -30
          echo "=== first failures per test ==="
          grep -E ": error: -\[" parity.log | sed 's#/Users/runner/work/lumen/lumen/##' \
            | sed 's/^.*error: //' \
            | awk '{ key = $1 " " $2; if (seen[key]++ < 2) print }' | head -40
          # Nearly every golden here starts with an XCTSkipUnless on kernel availability,
          # so a kernel that fails to compile reads as a skip. Any skip outside the
          # allowlist fails.
          python3 scripts/check-xctest-skips.py parity.log || status=1
          exit $status
